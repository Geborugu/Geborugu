name: Update Gaming Stats SVG

on:
  schedule:
    - cron: "0 */6 * * *" # Runs every 6 hours
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  update-card:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit changes back to the repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run stats generator script
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: node update-stats.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ./assets/stats.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update gaming stats svg" && git push)
